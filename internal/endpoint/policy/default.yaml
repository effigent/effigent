# effigentd policy
#
# Modes (per agent, falling back to `defaults`):
#   monitor   - observe only; matches of the deny/allow lists are reported as `would_block`
#   learn     - monitor + record every binary the agent runs (GET /learned -> ready-made allowlist)
#   denylist  - the kernel blocks exec of `exec_deny` and opens of `file_deny`
#   allowlist - the kernel blocks exec of anything NOT in `exec_allow` (and opens of `file_deny`)
#
# Exec lists are matched on the resolved binary path (symlinks followed), so on
# merged-/usr distros /bin/curl is reported and matched as /usr/bin/curl.
# Blocking is per binary, not per argv: `node good.js` and `node evil.js` are
# the same binary. Argument-level checks are alert-only.

defaults:
  mode: denylist
  exec_deny:            # demo rule: agents may not run curl & friends
    - /usr/bin/curl
    - /usr/bin/wget
    - /usr/bin/nc
    - /usr/bin/ncat
    - /usr/bin/netcat
    - /usr/bin/socat
    - /usr/bin/telnet
    - /bin/curl         # non-merged-/usr distros
    - /bin/nc
  file_alert:           # path suffixes reported when an agent opens them
    - /.env
    - /.env.local
    - /.env.production
    - /.ssh/id_rsa
    - /.ssh/id_ed25519
    - /.ssh/id_ecdsa
    - /.aws/credentials
    - /.config/gcloud/application_default_credentials.json
    - /.config/gcloud/credentials.db
    - /.kube/config
    - /.docker/config.json
    - /.netrc
    - /.git-credentials
    - /.npmrc
    - /.pypirc
    - /.pgpass
    - /.my.cnf
    - /.vault-token
    - /.config/gh/hosts.yml
    - /.terraform.d/credentials.tfrc.json
    - /.azure/msal_token_cache.json
    - /.azure/accessTokens.json
    - /.ssh/id_dsa
    - /etc/shadow
    - /.aws/sso/cache/          # a trailing / is a directory tree: agent hooks only
    - /.aws/cli/cache/
    - /.config/gcloud/legacy_credentials/
  file_deny:            # path suffixes the kernel refuses to open for agents
    - /etc/shadow
  network: true         # report outbound TCP connects
  # network_deny: [203.0.113.7, 10.0.0.0/8]   # block connections to these IPs/CIDRs
  # network_allow: [140.82.112.0/20]          # or: allow ONLY these (loopback always allowed)
  # domain_deny: [pastebin.com]               # block these hostnames: effigentd re-resolves them
  #                                           # every 30s and blocks the addresses. Shared CDN IPs
  #                                           # can over-block or miss; network_allow is stronger.
  # require_launcher: true                    # stop agents not started with `effigentd run --agent <name> -- <cmd>`
  #
  # What a command or tool call does, read by the agent hooks (Claude Code,
  # Codex, Gemini CLI; never the kernel). Kinds: protected_push, force_push,
  # branch_delete, history_rewrite, hook_bypass, destructive_sql, sql_write,
  # cloud_change, cloud_destroy, access, package_install, package_unlisted,
  # package_registry, package_scripts, package_malicious, package_vulnerable,
  # guardrail_edit, credential_read, remote_script, fs_destroy, mcp_unlisted,
  # model_endpoint, model_api_key. kind@env limits an entry to an environment.
  # actions_deny: [force_push, remote_script, package_malicious, destructive_sql@prod, cloud_destroy@prod]
  # actions_approve: [protected_push, guardrail_edit, cloud_change@prod, access@prod, package_vulnerable]
  # protected_branches: [main, "release/*"]
  # command_deny: ["* --dangerously-skip-permissions*"]   # * anywhere
  # file_write_deny: [/.github/workflows/, /CODEOWNERS]   # writes only; a trailing / is a tree
  # file_write_approve: [/migrations/]
  # package_deny: ["npm:event-stream", "pypi:colourama"]
  # package_approve: ["npm:@acme/*"]
  # package_allow: [...]                       # set it and every other package is package_unlisted
  # package_registries: [https://npm.acme.internal/]
  # mcp_allow: [github, "linear*"]
  # model_hosts_allow: [api.anthropic.com, "bedrock-runtime.*.amazonaws.com"]

agents:
  - name: claude-code
    binary_names: [claude]
    args_contains: ["@anthropic-ai/claude-code", "claude-code/cli.js"]
  - name: codex
    binary_names: [codex]
    args_contains: ["@openai/codex"]
  - name: gemini-cli
    binary_names: [gemini]
    args_contains: ["@google/gemini-cli"]
  - name: cursor-agent
    binary_names: [cursor-agent]
  - name: aider
    binary_names: [aider]
  - name: opencode
    binary_names: [opencode]
  - name: goose
    binary_names: [goose]
  - name: hermes          # verify the binary/args on the hermes CT and adjust
    binary_names: [hermes]
    args_contains: ["hermes_agent", "hermes-agent"]

# Labels for MCP servers inside an agent's tree. The first capture group names the server.
mcp_servers:
  - pattern: '@modelcontextprotocol/server-([\w.-]+)'
  - pattern: 'mcp[-_]server[-_]([\w.]+)'
  - pattern: '([\w.]+)[-_]mcp(?:[-_]server)?\b'
  - pattern: '\bmcp-remote\b'
    name: remote

# Environments for kind@env entries: the targets that make an action prod.
# environments:
#   prod:
#     aws_profiles: ["prod-*"]          # --profile / AWS_PROFILE
#     aws_accounts: ["111122223333"]    # from ~/.aws/config (sso_account_id, role_arn)
#     kube_contexts: ["prod-*"]         # --context or current-context
#     gcloud_projects: ["*-prod"]
#     azure_subscriptions: [Production]
#     terraform_workspaces: [prod]
#     pulumi_stacks: ["*/prod"]
#     hosts: ["*.prod.internal", 10.20.0.0/16]   # databases, hosts named in commands
#     mcp_servers: [prod-db]
#     match_unknown: false              # true: a cloud/database action with no known target counts as prod

# An MCP server with no known agent above it (e.g. launched by an unknown
# client) becomes its own tracked root and gets the `defaults` rule.
track_orphan_mcp: true
