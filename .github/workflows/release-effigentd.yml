name: Release effigentd

# Push a tag like `effigentd-v0.1.0` to build effigentd for Linux amd64/arm64
# and publish it to https://effigent.ai/releases/effigentd/<version>/, which is
# what https://effigent.ai/install.sh downloads (latest → the newest tag).

on:
  push:
    tags: ['effigentd-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  macos:
    # pkgbuild and lipo only exist on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal binary + pkg
        run: |
          v="${{ github.event.inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#effigentd-}"
          ./deploy/macos/build-pkg.sh "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/releases/effigentd/

  release:
    needs: macos
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#effigentd-}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./... && go vet ./...
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist/releases/effigentd/
      - name: Build
        run: |
          sed -i 's/shasum -a 256/sha256sum/' deploy/release/build-effigentd.sh
          ./deploy/release/build-effigentd.sh "${{ steps.v.outputs.version }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish
        run: |
          v="${{ steps.v.outputs.version }}"
          aws s3 cp "dist/releases/effigentd/$v/" "s3://${{ vars.SITE_BUCKET }}/releases/effigentd/$v/" --recursive \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/releases/effigentd/latest "s3://${{ vars.SITE_BUCKET }}/releases/effigentd/latest" \
            --content-type text/plain --cache-control "no-cache"
