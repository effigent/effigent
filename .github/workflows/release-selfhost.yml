name: Release self-hosted control plane

# Manual for now (Actions → Release self-hosted control plane → Run workflow):
# builds and pushes ghcr.io/effigent/effigent-cp:<version> and
# ghcr.io/effigent/effigent-console:<version> (+ :latest, amd64 + arm64) and
# publishes the effigent-cp Helm chart next to the effigentd chart at
# https://effigent.ai/charts. Both ghcr packages must be public for customers
# to pull them. See docs/self-hosting.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: charts-index   # one writer of charts/index.yaml at a time
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/effigent-cp/... ./internal/controlplane/... ./internal/shared/...
      - run: go test -count=1 ./cmd/effigent-cp/... ./internal/controlplane/... ./internal/shared/...
      - run: helm lint deploy/helm/effigent-cp --set controlPlane.url=https://api.example.com --set console.url=https://console.example.com --set oidc.issuer=https://idp.example.com --set oidc.clientId=c --set postgres.enabled=true

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Dockerfile.cp cross-compiles, so both platforms build without emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cp
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          push: true
          tags: |
            ghcr.io/effigent/effigent-cp:${{ inputs.version }}
            ghcr.io/effigent/effigent-cp:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}

  # The console ships native modules (sharp) in its standalone output, so each
  # platform builds on its own native runner (an emulated arm64 Next.js build hit
  # the 6h job limit) and the digests are merged into one tag below.
  console:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
          outputs: type=image,name=ghcr.io/effigent/effigent-console,push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: console-digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  console-manifest:
    needs: console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: console-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/effigent/effigent-console:${{ inputs.version }} \
            -t ghcr.io/effigent/effigent-console:latest \
            $(printf 'ghcr.io/effigent/effigent-console@sha256:%s ' *)
          docker buildx imagetools inspect ghcr.io/effigent/effigent-console:${{ inputs.version }}

  chart:
    needs: [images, console-manifest]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish Helm chart
        # helm repo add effigent https://effigent.ai/charts; helm install … effigent/effigent-cp
        run: |
          v="${{ inputs.version }}"
          mkdir -p dist/charts
          helm package deploy/helm/effigent-cp --version "${v#v}" --app-version "$v" -d dist/charts
          merge=""
          if aws s3 cp "s3://${{ vars.SITE_BUCKET }}/charts/index.yaml" dist/index.yaml; then merge="--merge dist/index.yaml"; fi
          helm repo index dist/charts --url https://effigent.ai/charts $merge
          aws s3 cp "dist/charts/effigent-cp-${v#v}.tgz" "s3://${{ vars.SITE_BUCKET }}/charts/" \
            --content-type application/gzip --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/charts/index.yaml "s3://${{ vars.SITE_BUCKET }}/charts/index.yaml" \
            --content-type text/yaml --cache-control "no-cache"
