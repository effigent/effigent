apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: raw-allowlist-pid
spec:
  lsmhooks:
  - hook: "bprm_check_security"
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchPIDs:
      - operator: In
        followForks: true
        isNamespacePID: false
        values: [67739]
      matchArgs:
      - index: 0
        operator: "NotEqual"
        values: ["/usr/bin/ls", "/usr/bin/cat", "/usr/bin/sh", "/usr/bin/dash", "/usr/bin/bash", "/usr/bin/head", "/usr/bin/sleep"]
      matchActions:
      - action: Override
        argError: -1
