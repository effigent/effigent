{{- if not .Values.keys.existingSecret }}
{{- /*
Generated once, then reused: `lookup` reads the live Secret on upgrade. Under
`helm template` (GitOps) lookup sees nothing and would generate new keys on
every render; set keys.existingSecret there.
*/}}
{{- $name := include "effigent-cp.keysSecret" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $live }}{{ $data = $live.data | default dict }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "effigent-cp.labels" . | nindent 4 }}
  annotations:
    # The signing key must survive `helm uninstall`: endpoints pin its public key.
    helm.sh/resource-policy: keep
type: Opaque
data:
  signing-key: {{ get $data "signing-key" | default (randBytes 32 | b64enc) }}
  admin-token: {{ get $data "admin-token" | default (randAlphaNum 40 | b64enc) }}
  secrets-key: {{ get $data "secrets-key" | default (randAlphaNum 48 | b64enc) }}
  session-secret: {{ get $data "session-secret" | default (randAlphaNum 48 | b64enc) }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ get $data "postgres-password" | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
{{- end }}
{{- $cfg := dict }}
{{- if and .Values.database.url (not .Values.database.existingSecret) }}{{ $_ := set $cfg "database-url" .Values.database.url }}{{ end }}
{{- if and .Values.oidc.clientSecret (not .Values.oidc.clientSecretExistingSecret) }}{{ $_ := set $cfg "client-secret" .Values.oidc.clientSecret }}{{ end }}
{{- if and .Values.smtp.url (not .Values.smtp.existingSecret) }}{{ $_ := set $cfg "smtp-url" .Values.smtp.url }}{{ end }}
{{- if $cfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "effigent-cp.configSecret" . }}
  labels:
    {{- include "effigent-cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $cfg }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
